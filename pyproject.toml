[project]
name = "developers-wilding"
version = "0.1.0"
description = "Contract-check open-weight model output through the Otari gateway and AISchemaGate."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "aischemagate==0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demo*"]

[tool.setuptools.package-data]
demo = ["contracts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
